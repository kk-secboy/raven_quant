name: quantlab-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-20m}
    max-file: ${LOG_MAX_FILES:-5}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: quantlab
      POSTGRES_USER: quantlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - quantlab_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlab -d quantlab"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab
      DATA_ROOT: /data
      RUN_EMBEDDED_WORKER: "false"
      QLIB_WORKER_URL: http://worker:8770
      RDAGENT_WORKER_URL: http://rdagent-worker:8770
      SCHEDULER_URL: http://scheduler:8780
      RDAGENT_ENABLED: "true"
      AUTH_MODE: ${AUTH_MODE:-required}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?PLATFORM_SECRET_KEY is required}
      TUSHARE_API_URL: ${TUSHARE_API_URL:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      BROKER_MODE: ${BROKER_MODE:-disabled}
      BROKER_GATEWAY_URL: ${BROKER_GATEWAY_URL:-}
      BROKER_HMAC_SECRET: ${BROKER_HMAC_SECRET:-}
      BROKER_TIMEOUT_SECONDS: ${BROKER_TIMEOUT_SECONDS:-10}
      BROKER_MAX_ORDER_NOTIONAL: ${BROKER_MAX_ORDER_NOTIONAL:-1000000}
      BROKER_MAX_ATTEMPTS: ${BROKER_MAX_ATTEMPTS:-3}
    command:
      - /bin/sh
      - -c
      - quant-db upgrade && quant-web --host 0.0.0.0 --port 8765
    volumes:
      - ${QUANTLAB_DATA_HOST_PATH:-/data/quantlab}:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    logging: *default-logging
    command: ["quant-scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab
      DATA_ROOT: /data
      TUSHARE_API_URL: ${TUSHARE_API_URL:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?PLATFORM_SECRET_KEY is required}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-15}
      HEALTH_SNAPSHOT_SECONDS: ${HEALTH_SNAPSHOT_SECONDS:-300}
      DATA_FRESHNESS_MAX_DAYS: ${DATA_FRESHNESS_MAX_DAYS:-7}
      STALE_JOB_HOURS: ${STALE_JOB_HOURS:-6}
      QLIB_WORKER_URL: http://worker:8770
      RDAGENT_WORKER_URL: http://rdagent-worker:8770
      RDAGENT_ENABLED: "true"
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      BROKER_MODE: ${BROKER_MODE:-disabled}
      BROKER_GATEWAY_URL: ${BROKER_GATEWAY_URL:-}
      BROKER_HMAC_SECRET: ${BROKER_HMAC_SECRET:-}
      BROKER_TIMEOUT_SECONDS: ${BROKER_TIMEOUT_SECONDS:-10}
      BROKER_MAX_ORDER_NOTIONAL: ${BROKER_MAX_ORDER_NOTIONAL:-1000000}
      BROKER_MAX_ATTEMPTS: ${BROKER_MAX_ATTEMPTS:-3}
    volumes:
      - ${QUANTLAB_DATA_HOST_PATH:-/data/quantlab}:/data
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      rdagent-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org/debian}
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab
      MLFLOW_TRACKING_URI: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab?options=-csearch_path%3Dpublic
      DATA_ROOT: /data
      QLIB_REPO: /opt/qlib
      QLIB_PYTHON: /usr/local/bin/python
      TUSHARE_API_URL: ${TUSHARE_API_URL:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?PLATFORM_SECRET_KEY is required}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-90}
      DOWNLOAD_WORKERS: ${DOWNLOAD_WORKERS:-4}
      WORKER_JOB_KINDS: bootstrap,data_verify,data_snapshot,data_qlib,minute_qlib,minute_research,qlib_baseline,margin_eligibility_download,core_intraday_download,supplemental_download,supplemental_cn_extended_daily,supplemental_cn_funds,supplemental_cn_macro,supplemental_cn_futures,supplemental_cn_options_bonds,supplemental_hk_market,supplemental_us_market,supplemental_global_markets,factor_evaluate,strategy_backtest,parameter_experiment,pair_backtest,pair_paper_rebalance,paper_rebalance
      RDAGENT_ENABLED: "false"
    volumes:
      - ${QUANTLAB_DATA_HOST_PATH:-/data/quantlab}:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  rdagent-docker:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
    volumes:
      - ${QUANTLAB_DATA_HOST_PATH:-/data/quantlab}:/data
      - rdagent_docker:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  rdagent-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rdagent
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org/debian}
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab
      DATA_ROOT: /data
      DOCKER_HOST: tcp://rdagent-docker:2375
      RDAGENT_ENABLED: "true"
      RDAGENT_LLM_KEY_ENV: ${RDAGENT_LLM_KEY_ENV:-OPENAI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4.1-mini}
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?PLATFORM_SECRET_KEY is required}
      WORKER_JOB_KINDS: rdagent_factor
    volumes:
      - ${QUANTLAB_DATA_HOST_PATH:-/data/quantlab}:/data
    depends_on:
      api:
        condition: service_healthy
      rdagent-docker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-38080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
      - scheduler

volumes:
  quantlab_postgres:
  rdagent_docker:

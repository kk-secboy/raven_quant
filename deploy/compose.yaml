name: quantlab-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-20m}
    max-file: ${LOG_MAX_FILES:-5}

x-release-environment: &release-environment
  QUANTLAB_RELEASE_ID: ${QUANTLAB_RELEASE_ID:-}
  QUANTLAB_CONFIG_DIGEST: ${QUANTLAB_CONFIG_DIGEST:-}
  QUANTLAB_RELEASE_KIND: ${QUANTLAB_RELEASE_KIND:-}
  QUANTLAB_RELEASE_ALIAS_OF: ${QUANTLAB_RELEASE_ALIAS_OF:-}
  QUANTLAB_CANONICAL_BASELINE: ${QUANTLAB_CANONICAL_BASELINE:-}
  QUANTLAB_WORKER_RUNTIME_IMAGE_DIGEST: ${QUANTLAB_WORKER_RUNTIME_IMAGE_DIGEST:-}

x-release-labels: &release-labels
  quantlab.release: ${QUANTLAB_RELEASE_ID:-}
  quantlab.config-digest: ${QUANTLAB_CONFIG_DIGEST:-}
  quantlab.release-kind: ${QUANTLAB_RELEASE_KIND:-}
  quantlab.alias-of: ${QUANTLAB_RELEASE_ALIAS_OF:-}
  quantlab.canonical-baseline: ${QUANTLAB_CANONICAL_BASELINE:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: quantlab
      POSTGRES_USER: quantlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - quantlab_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlab -d quantlab"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    image: quantlab-api-runtime:v2
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org/debian}
    restart: unless-stopped
    logging: *default-logging
    labels: *release-labels
    environment:
      <<: *release-environment
      DATABASE_URL: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab
      DATA_ROOT: /data
      RUN_EMBEDDED_WORKER: "false"
      QLIB_WORKER_URL: http://evaluation-worker:8770
      RDAGENT_WORKER_URL: http://rdagent-worker:8770
      RDAGENT_EVALUATION_WORKER_URL: http://evaluation-worker:8770
      SCHEDULER_URL: http://scheduler:8780
      RDAGENT_ENABLED: "true"
      RDAGENT_RUNTIME_IMAGE_DIGEST: ${RDAGENT_RUNTIME_IMAGE_DIGEST:-}
      RDAGENT_QLIB_SANDBOX_IMAGE: ${RDAGENT_QLIB_SANDBOX_IMAGE:-}
      MODEL_SANDBOX_IMAGE: ${MODEL_SANDBOX_IMAGE:-}
      AUTH_MODE: ${AUTH_MODE:-required}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-12}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?PLATFORM_SECRET_KEY is required}
      TUSHARE_API_URL: ${TUSHARE_API_URL:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      STRATEGY_HEALTH_SNAPSHOT_SECONDS: ${STRATEGY_HEALTH_SNAPSHOT_SECONDS:-3600}
    command:
      - /bin/sh
      - -c
      - quant-db upgrade && python scripts/retire_legacy_research.py --apply && quant-web --host 0.0.0.0 --port 8765
    volumes:
      - ${QUANTLAB_DATA_HOST_PATH:-/data/quantlab}:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  scheduler:
    image: quantlab-api-runtime:v2
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org/debian}
    restart: unless-stopped
    logging: *default-logging
    labels: *release-labels
    command: ["quant-scheduler"]
    environment:
      <<: *release-environment
      DATABASE_URL: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab
      DATA_ROOT: /data
      TUSHARE_API_URL: ${TUSHARE_API_URL:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?PLATFORM_SECRET_KEY is required}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-15}
      SCHEDULER_MAX_TICK_SECONDS: ${SCHEDULER_MAX_TICK_SECONDS:-300}
      RESEARCH_ASSET_AUTO_ENABLED: ${RESEARCH_ASSET_AUTO_ENABLED:-true}
      RESEARCH_ASSET_AUTO_HOUR: ${RESEARCH_ASSET_AUTO_HOUR:-20}
      RESEARCH_ASSET_AUTO_MINUTE: ${RESEARCH_ASSET_AUTO_MINUTE:-30}
      HEALTH_SNAPSHOT_SECONDS: ${HEALTH_SNAPSHOT_SECONDS:-300}
      STRATEGY_HEALTH_SNAPSHOT_SECONDS: ${STRATEGY_HEALTH_SNAPSHOT_SECONDS:-3600}
      DATA_FRESHNESS_MAX_DAYS: ${DATA_FRESHNESS_MAX_DAYS:-7}
      STALE_JOB_HOURS: ${STALE_JOB_HOURS:-6}
      QLIB_WORKER_URL: http://evaluation-worker:8770
      RDAGENT_WORKER_URL: http://rdagent-worker:8770
      RDAGENT_EVALUATION_WORKER_URL: http://evaluation-worker:8770
      RDAGENT_ENABLED: "true"
      RDAGENT_RUNTIME_IMAGE_DIGEST: ${RDAGENT_RUNTIME_IMAGE_DIGEST:-}
      RDAGENT_QLIB_SANDBOX_IMAGE: ${RDAGENT_QLIB_SANDBOX_IMAGE:-}
      MODEL_SANDBOX_IMAGE: ${MODEL_SANDBOX_IMAGE:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ${QUANTLAB_DATA_HOST_PATH:-/data/quantlab}:/data
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      evaluation-worker:
        condition: service_healthy
      paper-worker:
        condition: service_healthy
      rdagent-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    image: quantlab-worker-runtime:v2
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org/debian}
    restart: unless-stopped
    cpus: "16.0"
    mem_limit: 32g
    pids_limit: 512
    logging: *default-logging
    labels: *release-labels
    environment:
      <<: *release-environment
      DATABASE_URL: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab
      MLFLOW_TRACKING_URI: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab?options=-csearch_path%3Dpublic
      _MLFLOW_SERVER_ARTIFACT_ROOT: /data/artifacts/mlflow
      DATA_ROOT: /data
      QLIB_REPO: /opt/qlib
      QLIB_PYTHON: /usr/local/bin/python
      TUSHARE_API_URL: ${TUSHARE_API_URL:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?PLATFORM_SECRET_KEY is required}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-99}
      DOWNLOAD_WORKERS: ${DOWNLOAD_WORKERS:-4}
      WORKER_JOB_KINDS: bootstrap,baostock_overlap_validation,legacy_market_backfill,data_verify,data_snapshot,data_qlib,minute_qlib,margin_eligibility_download,core_intraday_download,ashare_5m_download,cninfo_announcements_download,announcement_nlp,announcement_factor_register,corpus_nlp,corpus_factor_register,event_market_response,report_rc_factors,report_rc_factor_register,major_news_mentions,major_news_mentions_factor_register,news_flash_factors,news_flash_factor_register,supplemental_download,supplemental_cn_extended_daily,supplemental_cn_funds,supplemental_cn_macro,supplemental_cn_institutional,supplemental_cn_futures,supplemental_cn_options_bonds,supplemental_hk_market,supplemental_us_market,supplemental_global_markets,supplemental_cn_governance_risk,supplemental_cn_capital_flow,supplemental_cn_fund_index_enhanced,supplemental_cn_derivatives_enhanced,supplemental_global_rates_enhanced,supplemental_research_corpus,supplemental_strategy_specialty,supplemental_strategy_specialty_minutes,research_asset_acquire
      WORKER_CONCURRENCY: "1"
      RESEARCH_CPU_BUDGET: "24"
      RESEARCH_MEMORY_BUDGET_GB: "40"
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      NUMEXPR_NUM_THREADS: "8"
      NUMEXPR_MAX_THREADS: "8"
      RDAGENT_ENABLED: "false"
      DOCKER_HOST: tcp://rdagent-docker:2375
      FACTOR_SANDBOX_IMAGE: quantlab-factor-sandbox:v2
      MODEL_SANDBOX_IMAGE: ${MODEL_SANDBOX_IMAGE:-}
    volumes:
      - ${QUANTLAB_DATA_HOST_PATH:-/data/quantlab}:/data
    depends_on:
      api:
        condition: service_healthy
      rdagent-docker:
        condition: service_healthy
      factor-sandbox-builder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  evaluation-worker:
    image: quantlab-worker-runtime:v2
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org/debian}
    restart: unless-stopped
    cpus: "24.0"
    mem_limit: 48g
    logging: *default-logging
    labels: *release-labels
    environment:
      <<: *release-environment
      DATABASE_URL: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab
      MLFLOW_TRACKING_URI: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab?options=-csearch_path%3Dpublic
      _MLFLOW_SERVER_ARTIFACT_ROOT: /data/artifacts/mlflow
      DATA_ROOT: /data
      QLIB_REPO: /opt/qlib
      QLIB_PYTHON: /usr/local/bin/python
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?PLATFORM_SECRET_KEY is required}
      WORKER_JOB_KINDS: minute_research,qlib_baseline,external_factor_evaluate,information_factor_evaluate,multiface_audit,factor_library_materialize,factor_library_cluster,factor_sota_evaluate,factor_evaluate,model_evaluate,model_ensemble_evaluate,quant_bundle_evaluate,strategy_backtest,strategy_health_collect,parameter_experiment
      WORKER_CONCURRENCY: "3"
      RESEARCH_CPU_BUDGET: "24"
      RESEARCH_MEMORY_BUDGET_GB: "40"
      QUANTLAB_QLIB_KERNELS: ${QUANTLAB_QLIB_KERNELS:-8}
      RDAGENT_ENABLED: "false"
      DOCKER_HOST: tcp://rdagent-docker:2375
      FACTOR_SANDBOX_IMAGE: quantlab-factor-sandbox:v2
      MODEL_SANDBOX_IMAGE: ${MODEL_SANDBOX_IMAGE:-}
    volumes:
      - ${QUANTLAB_DATA_HOST_PATH:-/data/quantlab}:/data
    depends_on:
      api:
        condition: service_healthy
      rdagent-docker:
        condition: service_healthy
      factor-sandbox-builder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  paper-worker:
    # Reserve one worker for the live paper lifecycle.  Long factor/model
    # research can fill evaluation-worker without delaying daily inference,
    # target generation, T+1 replay, or NAV publication.
    image: quantlab-worker-runtime:v2
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org/debian}
    restart: unless-stopped
    logging: *default-logging
    labels: *release-labels
    environment:
      <<: *release-environment
      DATABASE_URL: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab
      MLFLOW_TRACKING_URI: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab?options=-csearch_path%3Dpublic
      _MLFLOW_SERVER_ARTIFACT_ROOT: /data/artifacts/mlflow
      DATA_ROOT: /data
      QLIB_REPO: /opt/qlib
      QLIB_PYTHON: /usr/local/bin/python
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?PLATFORM_SECRET_KEY is required}
      WORKER_JOB_KINDS: model_refit,recommendation_refresh,simulation_order_plan,simulation_replay
      WORKER_CONCURRENCY: "1"
      RDAGENT_ENABLED: "false"
      DOCKER_HOST: tcp://rdagent-docker:2375
      FACTOR_SANDBOX_IMAGE: quantlab-factor-sandbox:v2
      MODEL_SANDBOX_IMAGE: ${MODEL_SANDBOX_IMAGE:-}
    volumes:
      - ${QUANTLAB_DATA_HOST_PATH:-/data/quantlab}:/data
    depends_on:
      api:
        condition: service_healthy
      rdagent-docker:
        condition: service_healthy
      factor-sandbox-builder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  rdagent-docker:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    logging: *default-logging
    labels: *release-labels
    environment:
      <<: *release-environment
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=tcp://0.0.0.0:2375
      - --tls=false
      - --insecure-registry=rdagent-registry:5000
    volumes:
      - ${QUANTLAB_DATA_HOST_PATH:-/data/quantlab}:/data
      # Generated-code images are large and must live on the dedicated data
      # disk, outside the governed market-data tree and the host root disk.
      - ${RDAGENT_DOCKER_HOST_PATH:-/data/quantlab-rdagent-docker}:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  rdagent-registry:
    profiles: ["sandbox-registry"]
    image: registry:2.8
    restart: "no"
    ports:
      - "127.0.0.1:${RDAGENT_REGISTRY_PORT:-55000}:5000"
    volumes:
      - ${RDAGENT_REGISTRY_HOST_PATH:-/data/quantlab-rdagent-registry}:/var/lib/registry

  factor-sandbox-builder:
    image: docker:27-dind
    restart: "no"
    environment:
      FACTOR_SANDBOX_BASE_IMAGE: quantlab-worker-runtime:v2
      FACTOR_SANDBOX_IMAGE: quantlab-factor-sandbox:v2
      FACTOR_SANDBOX_DOCKER_HOST: tcp://rdagent-docker:2375
    command: ["sh", "/context/build.sh"]
    volumes:
      - ./factor-sandbox:/context:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      rdagent-docker:
        condition: service_healthy

  model-sandbox-builder:
    # Development-only helper.  Capital-path model execution refuses mutable
    # tags, so production must preload MODEL_SANDBOX_IMAGE by immutable digest.
    profiles: ["model-sandbox-dev"]
    image: docker:27-dind
    restart: "no"
    environment:
      MODEL_SANDBOX_BASE_IMAGE: quantlab-worker-runtime:v2
      MODEL_SANDBOX_IMAGE: quantlab-model-sandbox:dev
      MODEL_SANDBOX_DOCKER_HOST: tcp://rdagent-docker:2375
    command: ["sh", "/context/build.sh"]
    volumes:
      - ./model-sandbox:/context:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      rdagent-docker:
        condition: service_healthy

  rdagent-worker:
    # Both RD-Agent queues must execute the exact same sealed runtime image.
    # A shared tag prevents two independent legacy-builder invocations from
    # producing byte-different image IDs from the same Dockerfile/context.
    image: quantlab-rdagent-runtime:v2
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rdagent
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org/debian}
    restart: unless-stopped
    cpus: "8.0"
    mem_limit: 12g
    logging: *default-logging
    labels: *release-labels
    environment:
      <<: *release-environment
      DATABASE_URL: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab
      DATA_ROOT: /data
      DOCKER_HOST: tcp://rdagent-docker:2375
      RDAGENT_ENABLED: "true"
      RDAGENT_RUNTIME_IMAGE_DIGEST: ${RDAGENT_RUNTIME_IMAGE_DIGEST:-}
      RDAGENT_DOCKER_SHARED_ROOT: /data
      RDAGENT_QLIB_SANDBOX_IMAGE: ${RDAGENT_QLIB_SANDBOX_IMAGE:-}
      RDAGENT_EVALUATION_WORKER_URL: http://evaluation-worker:8770
      MODEL_SANDBOX_IMAGE: ${MODEL_SANDBOX_IMAGE:-}
      RDAGENT_LLM_KEY_ENV: ${RDAGENT_LLM_KEY_ENV:-OPENAI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4.1-mini}
      FACTOR_COSTEER_PYTHON_BIN: python /app/scripts/run_factor_codegen_sandbox.py
      FACTOR_SANDBOX_IMAGE: quantlab-factor-sandbox:v2
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?PLATFORM_SECRET_KEY is required}
      WORKER_JOB_KINDS: rdagent_run
      RESEARCH_CPU_BUDGET: "24"
      RESEARCH_MEMORY_BUDGET_GB: "40"
    volumes:
      - ${QUANTLAB_DATA_HOST_PATH:-/data/quantlab}:/data
    depends_on:
      api:
        condition: service_healthy
      rdagent-docker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  rdagent-model-worker:
    image: quantlab-rdagent-runtime:v2
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rdagent
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org/debian}
    restart: unless-stopped
    cpus: "8.0"
    mem_limit: 16g
    logging: *default-logging
    labels: *release-labels
    environment:
      <<: *release-environment
      DATABASE_URL: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab
      DATA_ROOT: /data
      DOCKER_HOST: tcp://rdagent-docker:2375
      RDAGENT_ENABLED: "true"
      RDAGENT_RUNTIME_IMAGE_DIGEST: ${RDAGENT_RUNTIME_IMAGE_DIGEST:-}
      RDAGENT_DOCKER_SHARED_ROOT: /data
      RDAGENT_QLIB_SANDBOX_IMAGE: ${RDAGENT_QLIB_SANDBOX_IMAGE:-}
      RDAGENT_EVALUATION_WORKER_URL: http://evaluation-worker:8770
      MODEL_SANDBOX_IMAGE: ${MODEL_SANDBOX_IMAGE:-}
      RDAGENT_LLM_KEY_ENV: ${RDAGENT_LLM_KEY_ENV:-OPENAI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4.1-mini}
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?PLATFORM_SECRET_KEY is required}
      WORKER_JOB_KINDS: rdagent_model
      RESEARCH_CPU_BUDGET: "24"
      RESEARCH_MEMORY_BUDGET_GB: "40"
    volumes:
      - ${QUANTLAB_DATA_HOST_PATH:-/data/quantlab}:/data
    depends_on:
      api:
        condition: service_healthy
      rdagent-docker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  rdagent-report-worker:
    image: quantlab-rdagent-runtime:v2
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rdagent
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org/debian}
    restart: unless-stopped
    cpus: "4.0"
    mem_limit: 8g
    logging: *default-logging
    labels: *release-labels
    environment:
      <<: *release-environment
      DATABASE_URL: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab
      DATA_ROOT: /data
      DOCKER_HOST: tcp://rdagent-docker:2375
      RDAGENT_ENABLED: "true"
      RDAGENT_RUNTIME_IMAGE_DIGEST: ${RDAGENT_RUNTIME_IMAGE_DIGEST:-}
      RDAGENT_DOCKER_SHARED_ROOT: /data
      RDAGENT_QLIB_SANDBOX_IMAGE: ${RDAGENT_QLIB_SANDBOX_IMAGE:-}
      RDAGENT_EVALUATION_WORKER_URL: http://evaluation-worker:8770
      MODEL_SANDBOX_IMAGE: ${MODEL_SANDBOX_IMAGE:-}
      RDAGENT_LLM_KEY_ENV: ${RDAGENT_LLM_KEY_ENV:-OPENAI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4.1-mini}
      FACTOR_COSTEER_PYTHON_BIN: python /app/scripts/run_factor_codegen_sandbox.py
      FACTOR_SANDBOX_IMAGE: quantlab-factor-sandbox:v2
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?PLATFORM_SECRET_KEY is required}
      WORKER_JOB_KINDS: rdagent_factor_report
      RESEARCH_CPU_BUDGET: "24"
      RESEARCH_MEMORY_BUDGET_GB: "40"
    volumes:
      - ${QUANTLAB_DATA_HOST_PATH:-/data/quantlab}:/data
    depends_on:
      api:
        condition: service_healthy
      rdagent-docker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  rdagent-quant-worker:
    image: quantlab-rdagent-runtime:v2
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rdagent
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org/debian}
    restart: unless-stopped
    cpus: "12.0"
    mem_limit: 20g
    logging: *default-logging
    labels: *release-labels
    environment:
      <<: *release-environment
      DATABASE_URL: postgresql+psycopg://quantlab:${POSTGRES_PASSWORD}@postgres:5432/quantlab
      DATA_ROOT: /data
      DOCKER_HOST: tcp://rdagent-docker:2375
      RDAGENT_ENABLED: "true"
      RDAGENT_RUNTIME_IMAGE_DIGEST: ${RDAGENT_RUNTIME_IMAGE_DIGEST:-}
      RDAGENT_DOCKER_SHARED_ROOT: /data
      RDAGENT_QLIB_SANDBOX_IMAGE: ${RDAGENT_QLIB_SANDBOX_IMAGE:-}
      RDAGENT_EVALUATION_WORKER_URL: http://evaluation-worker:8770
      MODEL_SANDBOX_IMAGE: ${MODEL_SANDBOX_IMAGE:-}
      RDAGENT_LLM_KEY_ENV: ${RDAGENT_LLM_KEY_ENV:-OPENAI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4.1-mini}
      FACTOR_COSTEER_PYTHON_BIN: python /app/scripts/run_factor_codegen_sandbox.py
      FACTOR_SANDBOX_IMAGE: quantlab-factor-sandbox:v2
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY:?PLATFORM_SECRET_KEY is required}
      WORKER_JOB_KINDS: rdagent_quant
      RESEARCH_CPU_BUDGET: "24"
      RESEARCH_MEMORY_BUDGET_GB: "40"
    volumes:
      - ${QUANTLAB_DATA_HOST_PATH:-/data/quantlab}:/data
    depends_on:
      api:
        condition: service_healthy
      rdagent-docker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  web:
    image: quantlab-web-runtime:v2
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    logging: *default-logging
    labels: *release-labels
    environment: *release-environment
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *default-logging
    labels: *release-labels
    environment: *release-environment
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-38080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      scheduler:
        condition: service_healthy

volumes:
  quantlab_postgres:

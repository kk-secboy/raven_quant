[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rdagent-python-data"
version = "0.1.0"
description = "Resumable Tushare-to-Parquet bootstrap pipeline for Qlib and RD-Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=45,<49",
  "duckdb>=1.2,<2",
  "fastapi>=0.116,<1",
  "pandas>=2.2,<3",
  "pyarrow>=16,<24",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "rich>=13.9,<15",
  "scipy>=1.13,<2",
  "sqlalchemy>=2.0,<3",
  "statsmodels>=0.14,<1",
  "tables>=3.10,<4",
  "psycopg[binary]>=3.2,<4",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
quant-data = "quant_data.cli:app"
quant-db = "quant_platform.db_cli:app"
quant-worker = "quant_platform.worker_cli:app"
quant-scheduler = "quant_platform.scheduler_cli:app"
quant-web = "quant_platform.cli:app"
quant-broker-gateway = "quant_broker_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_data", "src/quant_platform", "src/quant_broker_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "no_database: unit test that must not initialize or mutate PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
